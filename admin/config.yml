backend:
  name: github
  repo: zjw0-0/xikesunny
  branch: main
  base_url: https://oauth.xikesunny.com
  auth_endpoint: /auth

media_folder: "images"
public_folder: "/images"

locale: 'zh_Hans'

collections:
  - name: "settings"
    label: "网站内容"
    editor:
      preview: false
    files:
      - name: "content"
        label: "网站内容管理"
        file: "content/content.json"
        fields:
          - label: "联系方式"
            name: "contact"
            widget: "object"
            fields:
              - { label: "电话", name: "phone", widget: "string" }
              - { label: "手机", name: "mobile", widget: "string" }
              - { label: "地址", name: "address", widget: "string" }
          - label: "产品列表"
            name: "products"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "产品名称", name: "name", widget: "string" }
              - { label: "主图", name: "image", widget: "image" }
              - { label: "角标", name: "tag", widget: "string", required: false }
              - { label: "认证标签", name: "badges", widget: "list", required: false, default: [] }
              - { label: "产品简介", name: "desc", widget: "text" }
              - { label: "详情内容（富文本，可图文混排）", name: "detail", widget: "markdown", required: false }
              - label: "详情图集（多张图片）"
                name: "gallery"
                widget: "list"
                required: false
                field: { label: "图片", name: "image", widget: "image" }
          - label: "新闻动态"
            name: "news"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
              - { label: "封面图", name: "image", widget: "image", required: false }
              - { label: "正文（富文本，可图文混排）", name: "content", widget: "markdown", required: false }
              - label: "图集（多张图片）"
                name: "gallery"
                widget: "list"
                required: false
                field: { label: "图片", name: "image", widget: "image" }
          - label: "使用案例"
            name: "cases"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "案例标题", name: "title", widget: "string" }
              - { label: "封面图", name: "image", widget: "image" }
              - { label: "案例介绍（富文本）", name: "content", widget: "markdown", required: false }
              - label: "图集（多张图片）"
                name: "gallery"
                widget: "list"
                required: false
                field: { label: "图片", name: "image", widget: "image" }
